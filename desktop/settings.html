<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7ef;font:14px/1.75 'Microsoft YaHei',sans-serif;color:#244735;padding:30px 36px}h1{font-size:26px;margin:0 0 7px}p{margin:0 0 21px;color:#83917b;font-size:12px}.tag{font-size:10px;letter-spacing:2px;color:#8a9a7f;margin-bottom:10px}.mode{border:1px solid #d8e1ce;border-radius:12px;background:#fff;display:flex;gap:12px;padding:16px;margin-bottom:12px;cursor:pointer}.mode:has(input:checked){border-color:#4c7852;background:#edf3e6}.mode input{margin-top:7px;accent-color:#28563d}.mode b{font-size:15px}.mode small{display:block;color:#819078;margin-top:3px}label.address{display:block;font-size:12px;margin:18px 0 6px}input[type=url]{width:100%;padding:12px;border:1px solid #d4dfc9;border-radius:8px;background:white;color:#244735;outline:none}input[type=url]:focus{border-color:#4e7951;box-shadow:0 0 0 3px #49744112}.hint{font-size:11px;color:#85927d;margin:7px 0 18px}.buttons{display:flex;gap:10px}button{border:1px solid #cad8bd;border-radius:8px;background:white;color:#365b3c;padding:11px 17px;font:inherit;cursor:pointer}.primary{background:#28563d;color:#fff;border-color:#28563d;flex:1}button:disabled{opacity:.5;cursor:wait}.note{background:#e9efdf;border-radius:9px;font-size:12px;padding:13px 16px;margin-top:20px;color:#708464}.note b{color:#385b38}.path{overflow-wrap:anywhere;font-size:10px;color:#95a18d;margin-top:12px}#result{font-size:12px;min-height:23px;margin-top:14px;white-space:pre-wrap}#result.error{color:#b16d46}.tip{font-size:11px;margin-top:7px;color:#85927d}</style></head><body>
<div class="tag">XISHI · CONNECTION</div><h1>启动与连接设置</h1><p>先在本地演示，准备好服务器后再切换联网。</p>
<label class="mode"><input type="radio" name="mode" value="local" checked><div><b>本地演示</b><small>无需网络，商品和图片保存在当前电脑。</small></div></label>
<label class="mode"><input type="radio" name="mode" value="online"><div><b>联网使用</b><small>连接共同的服务器，与其他同学共享商品信息。</small></div></label>
<label class="address" for="server">服务器地址</label><input id="server" type="url" placeholder="https://market.example.edu" autocomplete="off"><div class="hint">填写站点根地址，不要加 /api。联网服务需要 HTTPS。</div>
<div class="buttons"><button id="test" onclick="testConnection()">测试连接</button><button id="apply" class="primary" onclick="applySettings()">保存并切换</button></div><div id="result" role="status">正在读取设置…</div>
<div class="note"><b>两种模式的数据相互独立</b><br>切换不会删除本地商品，也不会自动上传到服务器。联网后请使用服务器上的账号登录。</div>
<div class="tip">本地演示账号：demo / buyer　密码：Campus2026!</div><div class="path" id="path"></div>
<script>
let busy=false;function result(text,error=false){const el=document.getElementById('result');el.textContent=text;el.className=error?'error':''}function lock(v){busy=v;document.querySelectorAll('button,input').forEach(x=>x.disabled=v)}
window.addEventListener('pywebviewready',async()=>{try{const s=await pywebview.api.get_settings();document.querySelector(`input[value="${s.mode}"]`).checked=true;document.getElementById('server').value=s.server_url;document.getElementById('path').textContent='本地数据与日志目录：'+s.data_home;result(s.warning||('当前模式：'+(s.mode==='local'?'本地演示':'联网使用')),!!s.warning)}catch(e){result('读取设置失败，请重新打开软件。',true)}});
async function testConnection(){if(busy)return;lock(true);result('正在检查服务器…');try{const r=await pywebview.api.test_connection(document.getElementById('server').value);result(r.message,!r.ok)}catch(e){result('连接测试未完成，请重试。',true)}finally{lock(false)}}
async function applySettings(){if(busy)return;lock(true);result('正在连接，请稍候…');try{const r=await pywebview.api.apply_settings({mode:document.querySelector('input[name=mode]:checked').value,server_url:document.getElementById('server').value});result(r.message,!r.ok)}catch(e){result('切换未完成，请重试。',true)}finally{lock(false)}}
</script></body></html>
