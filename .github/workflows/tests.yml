name: Project tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Check JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/campus.js
          node --check frontend/experience.js
          node --check scripts/experience-browser-test.cjs
          node --check scripts/campus-browser-test.cjs
          node --check scripts/browser-helpers.cjs
          node --check scripts/auth-browser-test.cjs
          node --check scripts/browser-test.cjs
          node --check scripts/search-browser-test.cjs
          node --check scripts/build-report.cjs
      - name: Run web API tests
        env:
          MARKET_DATA_DIR: ${{ runner.temp }}/xishi-ci-data
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14

  cloudstudio-start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        environment: [clean, incomplete]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check shell script
        run: sh -n start.sh
      - name: Simulate a previously failed environment
        if: matrix.environment == 'incomplete'
        run: |
          python -m venv --without-pip .venv
      - name: Run cloud startup and proxy smoke test
        shell: bash
        run: |
          export MARKET_DATA_DIR="$RUNNER_TEMP/xishi-cloud-data"
          export MARKET_PUBLIC_ORIGIN=https://preview.example.test
          export COOKIE_SECURE=0
          export PORT=8011
          sh start.sh --cloud > "$RUNNER_TEMP/xishi-cloud.log" 2>&1 &
          market_server_pid=$!
          trap 'kill "$market_server_pid" 2>/dev/null || true' EXIT
          python scripts/cloudstudio-smoke.py --report evidence/cloudstudio-smoke-results.json
      - name: Save cloud startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudstudio-start-results-${{ matrix.python }}-${{ matrix.environment }}
          path: |
            evidence/cloudstudio-smoke-results.json
            ${{ runner.temp }}/xishi-cloud.log
          if-no-files-found: ignore
          retention-days: 14
